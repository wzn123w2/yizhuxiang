# 山寺 · nginx 反向代理模板（不想用 Caddy 时）
#
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/shansi.conf
#   sudo certbot --nginx -d shansi.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# 关键点：WebSocket 必须手写 Upgrade 头，且 read_timeout 要大于服务端 20s 心跳。

server {
    listen 80;
    listen [::]:80;
    server_name shansi.example.com;

    # certbot --nginx 会自动补 443 与证书段

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /healthz {
        proxy_pass http://127.0.0.1:8787;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
